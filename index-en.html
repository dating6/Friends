<script type="text/javascript">
(function(){
  var baseUrl = "https://prpops.com/p/1kbzc/direct";

  // إعدادات
  var HISTORY_KEY = 'cb_16_history_v1'; // مفتاح التخزين المحلي
  var MAX_HISTORY = 1000;               // نحتفظ بآخر 1000 قيمة لتقليل التصادمات المحلية

  // يولد رقم عشــوائي مكوّن من 16 خانة (string)
  function generate16DigitRandom() {
    var MIN = 10n ** 15n;               // أصغر رقم مكوّن من 16 خانة
    var RANGE = 9n * (10n ** 15n);      // مقدار النطاق

    if (window.crypto && crypto.getRandomValues) {
      // نولّد 128-بت عشوائي (4 × 32bit)
      var arr = new Uint32Array(4);
      crypto.getRandomValues(arr);
      // تجميع إلى BigInt
      var rand = (BigInt(arr[0]) << 96n) | (BigInt(arr[1]) << 64n) | (BigInt(arr[2]) << 32n) | BigInt(arr[3]);
      // تقليص داخل النطاق المطلوب
      var num = (rand % RANGE) + MIN;
      return num.toString();
    } else {
      // fallback أقل أماناً لكنه عملي: نركّب سلسلة أرقام عشوائية حتى 16 رقم
      var s = '';
      while (s.length < 16) {
        s += Math.floor(Math.random() * 1e12).toString();
      }
      s = s.slice(0, 16);
      if (s[0] === '0') s = (Math.floor(Math.random() * 9) + 1).toString() + s.slice(1);
      return s;
    }
  }

  // قراءة/كتابة سجل القيم في localStorage
  function readHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      if (!raw) return [];
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) return arr;
      return [];
    } catch (e) {
      return [];
    }
  }
  function writeHistory(arr) {
    try {
      if (arr.length > MAX_HISTORY) arr = arr.slice(-MAX_HISTORY);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
    } catch (e) {}
  }

  // توليد قيمة جديدة غير مكرّرة
  function uniqueCbLocal() {
    var history = readHistory();
    var tries = 0;
    var val;
    do {
      val = generate16DigitRandom();
      tries++;
    } while (history.indexOf(val) !== -1 && tries < 100);
    history.push(val);
    writeHistory(history);
    return val;
  }

  var cbValue = uniqueCbLocal(); // string من 16 رقم
  var finalUrl = baseUrl + "?cb=" + encodeURIComponent(cbValue);

  // إعادة التوجيه
  window.location.href = finalUrl;
})();
</script>
