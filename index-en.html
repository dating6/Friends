<script type="text/javascript">
(function(){
  var baseUrl = "https://p.pcdelv.com/go/496159/747752/aHR0cHMlM0EvL2ZyaWVuZHMtYnN6LnBhZ2VzLmRldi9pbmRleC1lbg==";

  // إعدادات
  var HISTORY_KEY = 'cb_17_history_v1'; // مفتاح التخزين المحلي
  var MAX_HISTORY = 1000;               // نحتفظ بآخر 1000 قيمة لتقليل التصادمات المحلية

  // يولد رقم عشــوائي مكوّن من 17 خانة (string) باستخدام crypto.getRandomValues (128-bit)
  function generate17DigitRandom() {
    var MIN = 10n ** 16n;               // أصغر رقم مكوّن من 17 خانة
    var RANGE = 9n * (10n ** 16n);      // مقدار النطاق

    if (window.crypto && crypto.getRandomValues) {
      // نولّد 128-بت عشوائي (4 × 32bit)
      var arr = new Uint32Array(4);
      crypto.getRandomValues(arr);
      // تجميع إلى BigInt
      var rand = (BigInt(arr[0]) << 96n) | (BigInt(arr[1]) << 64n) | (BigInt(arr[2]) << 32n) | BigInt(arr[3]);
      // تقليص داخل النطاق المطلوب
      var num = (rand % RANGE) + MIN;
      return num.toString();
    } else {
      // fallback أقل أماناً لكنه عملي: نركّب سلسلة أرقام عشوائية حتى 17 رقم
      var s = '';
      while (s.length < 17) {
        s += Math.floor(Math.random() * 1e12).toString();
      }
      s = s.slice(0, 17);
      if (s[0] === '0') s = (Math.floor(Math.random() * 9) + 1).toString() + s.slice(1);
      return s;
    }
  }

  // قراءة/كتابة سجل القيم في localStorage
  function readHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      if (!raw) return [];
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) return arr;
      return [];
    } catch (e) {
      return [];
    }
  }
  function writeHistory(arr) {
    try {
      // نحتفظ بأحدث MAX_HISTORY عناصر فقط
      if (arr.length > MAX_HISTORY) arr = arr.slice(-MAX_HISTORY);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
    } catch (e) {
      // متصفح قد يمنع التخزين — نتجاهل
    }
  }

  // نحاول توليد قيمة جديدة غير موجودة في السجل المحلي. نحدّ من المحاولات
  function uniqueCbLocal() {
    var history = readHistory();
    var tries = 0;
    var val;
    do {
      val = generate17DigitRandom();
      tries++;
    } while (history.indexOf(val) !== -1 && tries < 100);
    // نحفظها في السجل
    history.push(val);
    writeHistory(history);
    return val;
  }

  var cbValue = uniqueCbLocal(); // string من 17 رقم
  var finalUrl = baseUrl + "?cb=" + encodeURIComponent(cbValue);

  // إعادة التوجيه
  window.location.href = finalUrl;
})();
</script>
